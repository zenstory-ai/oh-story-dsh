name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `os` preserves protected check identifiers, not the runner label.
        # Keep macOS 26 coverage on Intel while hosted Arm64 capacity is unavailable.
        include:
          - os: macos-latest
            runner: macos-26-intel
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:portable

  native-dsh-smoke:
    name: Packaged DSH Web smoke (${{ matrix.label }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            script: test:dsh
          - label: 0.2.0-rc.2
            script: test:dsh:rc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure Chrome for the official DSH Web smoke
        run: command -v google-chrome >/dev/null || pnpm exec playwright install --with-deps chrome
      - name: Pack plugin and run DSH Web smoke (${{ matrix.label }})
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT
          pnpm --filter @oh-story/dsh pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' | head -n 1)"
          test -f "$tarball"
          OH_STORY_PACKED_TARBALL="$tarball" pnpm "${{ matrix.script }}"

  native-dsh:
    name: Packaged DSH Web integration
    needs: native-dsh-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DSH Web smoke matrix succeeded
        shell: bash
        run: |
          if [[ "${{ needs.native-dsh-smoke.result }}" != "success" ]]; then
            echo "Packaged DSH Web smoke matrix finished with status: ${{ needs.native-dsh-smoke.result }}"
            exit 1
          fi
